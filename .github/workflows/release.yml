name: Release Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to release (e.g. v2.0.0)'
        required: false
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Windows Desktop App
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies & Freeze Vision Engine
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/trinetra-core
          pip install -r services/vision-engine/requirements.txt
          python services/vision-engine/freeze_engine.py
          New-Item -ItemType Directory -Force -Path apps/desktop/src-tauri/binaries
          Copy-Item -Path "services/vision-engine/dist/trinetra-vision-engine/trinetra-vision-engine.exe" -Destination "apps/desktop/src-tauri/binaries/trinetra-vision-engine-x86_64-pc-windows-msvc.exe" -Force
          Copy-Item -Path "services/vision-engine/dist/trinetra-vision-engine/*" -Destination "apps/desktop/src-tauri/binaries" -Recurse -Force

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Desktop Dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Build and Release with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name || inputs.tag }}
          releaseName: 'Trinetra v__VERSION__'
          releaseBody: 'Trinetra Assistive Vision Suite v__VERSION__ for Windows'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonKeepUniversal: true
          owner: ${{ vars.RELEASES_REPO_OWNER || github.repository_owner }}
          repo: ${{ vars.RELEASES_REPO_NAME || 'trinetra-releases' }}
