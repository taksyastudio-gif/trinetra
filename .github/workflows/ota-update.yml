name: Mobile OTA Update (EAS Update)

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/mobile/**'
  workflow_dispatch:

jobs:
  ota-update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup Expo CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        run: npm ci

      - name: Publish OTA Update
        run: eas update --branch production --message "Auto-update from commit ${{ github.sha }}"
