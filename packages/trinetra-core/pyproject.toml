[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trinetra-core"
version = "2.0.0"
description = "TRINETRA v2 Platform-Agnostic Core & Hardware Abstraction Layer"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Trinetra Assistive Engineering Team", email = "dev@trinetra.ai"}
]
keywords = ["assistive-ai", "edge-intelligence", "offline-first", "nepal", "accessibility"]
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["trinetra_core*"]
