<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="irisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Eye shape -->
  <ellipse cx="50" cy="50" rx="40" ry="28" fill="none" stroke="url(#eyeGrad)" stroke-width="3"/>
  <!-- Iris -->
  <circle cx="50" cy="50" r="16" fill="url(#irisGrad)" opacity="0.9"/>
  <!-- Pupil -->
  <circle cx="50" cy="50" r="7" fill="#0a0a1a"/>
  <!-- Light reflection -->
  <circle cx="45" cy="45" r="3" fill="white" opacity="0.7"/>
  <!-- Third eye dot above -->
  <circle cx="50" cy="18" r="4" fill="url(#eyeGrad)" opacity="0.8"/>
</svg>
